# Fixture diferencial de io_espelho.st.
# Ver backend/tests/diferencial/README.md para o formato.
#
# io_espelho.st e "saida := entrada;" todo ciclo: sem estado, sem contador --
# o oposto de blink.st. %QX0.1 tem que seguir %IX0.1 NO MESMO ciclo, prova
# de que o executor le a entrada e aplica a logica dentro do mesmo scan
# (nao com um ciclo de atraso).

st = "io_espelho.st"
