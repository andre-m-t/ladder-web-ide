# Configuração de ferramentas do backend.
# As dependências ficam em requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: exige a toolchain do ESP32 e leva minutos no primeiro build",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
